[project]
name = "drisai-api"
version = "0.1.0"
description = "API do DRISAI — sistema de gestão nutricional agrícola (método DRIS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "httpx>=0.28",
    "reportlab>=4.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
